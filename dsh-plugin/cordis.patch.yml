# The panel is a plain dependency of this package, mounted from here so that a
# single `dsh plugin add @mlt_123/dsh-openfuyao-test` also wires up the
# right-sidebar UI. Its Host half exists only so the Loader has a row to mount;
# the visible surface is the Client tab registered in panel/client.js.
- insert:
    - id: openfuyao
      name: '@mlt_123/dsh-openfuyao-test'
      config:
        mode: auto
        baseUrl: http://127.0.0.1:8000
        agentName: openfuyao-deployer
        requireApproval: true
    - id: openfuyao-panel
      name: '@mlt_123/dsh-openfuyao-panel-test'
      config: {}
